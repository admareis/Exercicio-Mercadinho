<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Story+Script&display=swap" rel="stylesheet">
    <title>Home - Mercadinho Vendi Mais</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="container">
        <nav>
            <h1>Mercadinho Vendi Mais</h1> 
            <img src="./assets/imagem carrinho.jpeg" alt="Carrinho de compras">
        </nav>
        
    <div class="forms">
    <form action="" id="formulario">
        <img src="./assets/trigo.svg" class="imgform" alt="">
        <label for="produto">Produto:</label>
        <input type="text" id="produto" name="produto" required placeholder="Ex: Arroz 5kg"">
    
        <img src="./assets/caixas.svg" class="imgform" alt="">
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="qtd" name="quantidade" required placeholder="Ex: 2">
        
        <img src="./assets/usd.svg" class="imgform" alt="">
        <label for="preco">Preço:</label>
        <input type="text" id="preco" name="preco" inputmode="decimal" required placeholder="Ex: 26,50">

        <button type="submit"><img src="./assets/verificacao-da-lista-da-area-de-transferencia.svg" class="imgform" alt=""> Adicionar</button>        
    </form>
    </div>

                <div id="listaProdutos"></div>
                <div><button type="button" class="calculo" onclick="calcularTotal()">Mostrar Total</button></div>
                <div><p id="total"></p></div>
    </div>
    
    
    <script src="script.js"></script>
    
    
</body>
</html>
